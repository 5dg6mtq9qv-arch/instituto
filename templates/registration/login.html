{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | Instituto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/instituto.css' %}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark">I</span>
      <div>
        <strong>Instituto</strong>
        <small>Plataforma academica</small>
      </div>
    </div>
    <h1>Ingreso</h1>
    {% if form.errors %}
      <div class="alert alert-danger">Usuario o clave incorrectos.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
        <input class="form-control" type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Clave</label>
        <input class="form-control" type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Ingresar</button>
    </form>
  </main>
</body>
</html>
